name: Native ARM64 tests

on:
  push:
    branches:
      - main
      - ci/routine-arm64

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'cdimartino/astral-wake'
    name: Godot checks (native ARM64)
    runs-on: [self-hosted, macOS, ARM64, homelab-macos-arm64]
    timeout-minutes: 30
    env:
      ASTRAL_AUDIO_DRIVER: Dummy
    steps:
      - name: Verify native ARM64 guest
        run: |
          set -eu
          test "$(uname -s)/$(uname -m)" = Darwin/arm64
          test "$(sysctl -in sysctl.proc_translated)" != 1
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Godot engine
        run: bash tools/bootstrap.sh --engine-only
      - name: Run test suite
        run: bash tools/check.sh
