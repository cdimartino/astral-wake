name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Godot 4.7.2 checks
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ASTRAL_AUDIO_DRIVER: Dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pinned Godot engine
        run: bash tools/bootstrap.sh --engine-only

      - name: Run test suite
        run: bash tools/check.sh
